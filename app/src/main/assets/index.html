<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>いのうトーナメント</title>
<style>
  :root{--bg:#0d0f1a;--panel:#151a2e;--line:#3b4a7a;--ink:#e8ecff;--mut:#8d97c2;--a:#5fd0ff;--b:#ff7a8a;--gold:#ffd166}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .scr{position:fixed;inset:0;display:none;flex-direction:column;padding:14px;overflow-y:auto}
  .scr.on{display:flex}
  .win{border:3px solid var(--ink);border-radius:8px;background:var(--panel);padding:14px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line)}
  h1{font-size:20px;margin:4px 0 12px;text-align:center;letter-spacing:.1em}
  h2{font-size:17px;margin:0 0 10px;text-align:center}
  .mut{color:var(--mut);font-size:13px;text-align:center;margin:0 0 12px}
  .btn{display:block;width:100%;margin-top:10px;padding:13px;border:3px solid var(--ink);border-radius:8px;background:#22305e;color:var(--ink);font:inherit;font-size:17px;font-weight:700}
  .btn:active{background:#33468a}
  .btn.sub{background:transparent;font-size:14px;padding:9px;border-width:2px}
  .btn.gold{background:#5a4513;border-color:var(--gold)}
  .nums{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .nums button{padding:10px 0;border:2px solid var(--line);border-radius:6px;background:#0a0c16;color:var(--ink);font:inherit;font-size:17px;font-weight:700}
  .nums button.on{background:var(--gold);color:#222;border-color:var(--gold)}
  .names input{width:100%;margin-top:6px;background:#0a0c16;color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:9px;font:inherit;font-size:16px}
  .choice{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:#0a0c16;color:var(--ink);font:inherit;font-size:18px;font-weight:700}
  .choice small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
  .choice:active{border-color:var(--gold)}
  .els{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .els .choice{text-align:center;font-size:14px;padding:16px 0;white-space:nowrap;letter-spacing:-.05em}
  .step{font-size:12px;color:var(--gold);text-align:center;margin-bottom:4px;letter-spacing:.2em}
  .build{font-size:22px;font-weight:800;text-align:center;margin:16px 0;line-height:1.5}
  .build small{display:block;font-size:13px;color:var(--mut);font-weight:400}
  #top{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;color:var(--mut)}
  #top span{flex:1}
  #top button{background:none;border:2px solid var(--line);color:var(--ink);border-radius:6px;font:inherit;padding:4px 10px}
  #status{min-height:62px}
  .hp{display:flex;gap:8px;align-items:center;font-size:13px;margin:3px 0}
  .hp{font-size:15px}
  .hp b{width:8.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:3px;background:#000;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:#4cd964;transition:width .4s}
  .bar.low i{background:#ff3b30}
  #log{flex:1;overflow-y:auto;font-size:19px;line-height:1.7;margin-top:10px}
  #log p{margin:0 0 8px}
  #log .say{color:#ffe9a8}
  #log .tag{display:inline-block;font-size:12px;background:var(--line);color:var(--ink);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
  #log p{margin:0 0 3px;white-space:pre-wrap}
  #log .sys{color:var(--gold)} #log .a{color:var(--a)} #log .b{color:var(--b)}
  #log .dim{color:var(--mut);font-size:14px}
  #log .ev{color:#c7f9a6}
  #log .big{font-size:20px;font-weight:800;text-align:center;margin:8px 0}
  #log .rank{font-size:14px;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:4px 8px;margin:4px 0}
  #log .rule{border-top:2px dashed var(--line);margin:12px 0}
  #log .br{font-size:13px;line-height:1.8;color:var(--mut)}
  #next{position:fixed;right:24px;bottom:24px;font-size:22px;animation:bl 1s infinite;color:var(--gold);display:none}
  @keyframes bl{50%{opacity:.2}}
  .res{font-size:14px;line-height:1.7}
  .res div{display:flex;gap:8px;border-bottom:1px solid #222a48;padding:4px 0}
  .res b{width:2.2em;color:var(--gold);text-align:center}
  .res span{flex:1}
  /* 横向き：パネルは中央寄せ、試合は左にHP・右にログ */
  @media (orientation: landscape){
    .scr > .win{max-width:620px;width:100%;margin-left:auto!important;margin-right:auto!important}
    #battle{display:none;grid-template-columns:minmax(220px,32%) 1fr;grid-template-rows:auto 1fr;column-gap:12px}
    #battle.on{display:grid}
    #top{grid-column:1 / 3}
    #status{align-self:start}
    #log{margin-top:0;min-height:0}
    .els{grid-template-columns:repeat(5,1fr)}
  }
</style>
</head>
<body>

<!-- 人数と名前 -->
<section class="scr on" id="setup">
  <div class="win" style="margin:auto 0">
    <h1>― いのうトーナメント ―</h1>
    <p class="mut">しょくぎょう × ぞくせい × とくしゅスキル でのうりょくがきまる。<br>強さはえらぶまで分からない。</p>
    <h2>プレイヤーの人数</h2>
    <div class="nums" id="nums"></div>
    <p class="mut" style="margin-top:8px">足りないわくはCPUがさんせん（ぜん8人）</p>
    <div class="names" id="names"></div>
    <button class="btn" id="start">のうりょくをえらびに行く</button>
  </div>
</section>

<!-- 交代画面 -->
<section class="scr" id="handoff">
  <div class="win" style="margin:auto 0">
    <h2 id="hoName"></h2>
    <p class="mut">ほかの人はがめんを見ないでね</p>
    <button class="btn gold" id="hoGo">のうりょくをえらぶ</button>
  </div>
</section>

<!-- 能力選び -->
<section class="scr" id="pick">
  <div class="win" style="margin:auto 0">
    <div class="step" id="pkStep"></div>
    <h2 id="pkTitle"></h2>
    <div id="pkList"></div>
    <button class="btn sub" id="pkReroll"></button>
  </div>
</section>

<!-- 能力の確認 -->
<section class="scr" id="confirm">
  <div class="win" style="margin:auto 0">
    <h2 id="cfName"></h2>
    <div class="build" id="cfBuild"></div>
    <p class="mut">強さはしあいで明らかになる</p>
    <button class="btn gold" id="cfNext"></button>
  </div>
</section>

<!-- 試合 -->
<section class="scr" id="battle">
  <div id="top"><span id="round"></span><button id="voice">🔇 読み上げ</button><button id="skip">⏩</button></div>
  <div class="win" id="status"></div>
  <div class="win" id="log"></div>
  <div id="next">▼</div>
</section>

<!-- 結果 -->
<section class="scr" id="end">
  <div class="win" style="margin:auto 0">
    <h1 id="endTitle"></h1>
    <div class="build" id="endBuild"></div>
    <h2>ぜんいんののうりょくランク</h2>
    <div class="res" id="endList"></div>
    <button class="btn gold" id="again">同じメンバーでのうりょくをえらび直す</button>
    <button class="btn sub" id="toSetup">人数・名前をかえる</button>
  </div>
</section>

<script src="data.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const R = () => Math.random();
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => a.map(x => [R(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ---- データを扱いやすい形に ----
const JOB = JOBS.map(([id, n, p, tags, lines]) => ({id, n, p, tags, lines}));
const SKILL = SKILLS.map(([id, n, d, p, tags, lines]) => ({id, n, d, p, tags, lines}));
const EL = Object.fromEntries(ELEMENTS.map(e => [e.id, e]));
const CPU_NAMES = ['タナカ','スズキ','ミドリ','ゴンザレス','ハナコ','ケンジ','モモ','ジロー','サクラ','リュウ','ポチ','カオル','ヨシオ','マリア'];

function makeFighter(name, human, job, el, skill){
  const keys = new Set(['j.' + job.id, 's.' + skill.id, 'e.' + el, ...job.tags.map(t => 't.' + t), ...skill.tags.map(t => 't.' + t)]);
  return {n: name, human, job, el, skill, keys, power: job.p + skill.p, label: `${EL[el].n}の${job.n}`, revealed: false};
}
function rankOf(p){ return p >= 85 ? 'S' : p >= 70 ? 'A' : p >= 52 ? 'B' : p >= 35 ? 'C' : p >= 20 ? 'D' : 'E'; }
const RANK_TXT = {S:'S（ちょう当たり！）', A:'A（当たり）', B:'B（なかなか）', C:'C（ふつう）', D:'D（いまいち）', E:'E（ちょうハズレ……）'};

// ================= セットアップ =================
let setup = load('setup', {count: 1, names: []});
function renderSetup(){
  $('nums').innerHTML = '';
  for (let i = 1; i <= 8; i++){
    const b = document.createElement('button'); b.textContent = i; b.className = i === setup.count ? 'on' : '';
    b.onclick = () => { readNames(); setup.count = i; renderSetup(); };
    $('nums').appendChild(b);
  }
  $('names').innerHTML = '';
  for (let i = 0; i < setup.count; i++){
    const inp = document.createElement('input'); inp.maxLength = 10;
    inp.placeholder = `プレイヤー${i + 1}の名前`; inp.value = setup.names[i] || '';
    $('names').appendChild(inp);
  }
}
function readNames(){ [...$('names').querySelectorAll('input')].forEach((x, i) => setup.names[i] = x.value.trim()); }
renderSetup();

let players = [], pi = 0, used = {job: new Set(), skill: new Set()};
$('start').onclick = () => {
  readNames(); save('setup', setup);
  players = Array.from({length: setup.count}, (_, i) => ({n: setup.names[i] || `プレイヤー${i + 1}`}));
  pi = 0; used = {job: new Set(), skill: new Set()};
  startPick();
};

// ================= 能力選び =================
let cur = null;
function startPick(){
  if (pi >= players.length){ runTournament(); return; }
  cur = {p: players[pi], reroll: 1, step: 0};
  $('hoName').textContent = `${cur.p.n} の番です`;
  show('handoff');
}
$('hoGo').onclick = () => { cur.opts = drawJobs(); renderPick(); show('pick'); };
function drawJobs(){ return shuffle(JOB.filter(j => !used.job.has(j.id))).slice(0, 4); }
function drawSkills(){ return shuffle(SKILL.filter(s => !used.skill.has(s.id))).slice(0, 4); }
function renderPick(){
  const L = $('pkList'); L.innerHTML = ''; L.className = '';
  $('pkReroll').style.display = 'none';
  if (cur.step === 0){
    $('pkStep').textContent = 'STEP 1 / 3'; $('pkTitle').textContent = 'しょくぎょうをえらべ';
    cur.opts.forEach(j => L.appendChild(choice(j.n, '', () => { cur.job = j; cur.step = 1; renderPick(); })));
    rerollBtn(() => { cur.opts = drawJobs(); });
  } else if (cur.step === 1){
    $('pkStep').textContent = 'STEP 2 / 3'; $('pkTitle').textContent = 'ぞくせいをえらべ';
    L.className = 'els';
    ELEMENTS.forEach(e => L.appendChild(choice(e.n, '', () => { cur.el = e.id; cur.step = 2; cur.opts = drawSkills(); renderPick(); })));
  } else {
    $('pkStep').textContent = 'STEP 3 / 3'; $('pkTitle').textContent = 'とくしゅスキルをえらべ';
    cur.opts.forEach(s => L.appendChild(choice(s.n, s.d, () => { cur.skill = s; finishPick(); })));
    rerollBtn(() => { cur.opts = drawSkills(); });
  }
}
function rerollBtn(fn){
  if (cur.reroll <= 0) return;
  const b = $('pkReroll'); b.style.display = 'block';
  b.textContent = `引き直す（あと${cur.reroll}回）`;
  b.onclick = () => { cur.reroll--; fn(); renderPick(); };
}
function choice(t, sub, fn){
  const b = document.createElement('button'); b.className = 'choice';
  b.innerHTML = t + (sub ? `<small>${sub}</small>` : ''); b.onclick = fn; return b;
}
function finishPick(){
  used.job.add(cur.job.id); used.skill.add(cur.skill.id);
  const f = makeFighter(cur.p.n, true, cur.job, cur.el, cur.skill);
  players[pi].f = f;
  $('cfName').textContent = `${cur.p.n} ののうりょく`;
  $('cfBuild').innerHTML = `${f.label}<br>× ${f.skill.n}<small>${f.skill.d}</small>`;
  $('cfNext').textContent = pi + 1 < players.length ? 'つぎの人にわたす' : 'トーナメントかいし！';
  show('confirm');
}
$('cfNext').onclick = () => { pi++; startPick(); };

// ================= ログ表示・読み上げ =================
let speak = load('voice', false), fast = false;
const log = $('log');
function setVoiceBtn(){ $('voice').textContent = speak ? '🔊 読み上げ' : '🔇 読み上げ'; }
setVoiceBtn();
$('voice').onclick = e => { e.stopPropagation(); speak = !speak; save('voice', speak); setVoiceBtn(); if (!speak) stopSpeak(); };
$('skip').onclick = e => { e.stopPropagation(); fast = !fast; $('skip').style.color = fast ? 'var(--gold)' : ''; if (fast) stopSpeak(); };
function stopSpeak(){ try{ window.Android ? Android.stop() : speechSynthesis.cancel(); }catch(e){} }
function say(text){
  return new Promise(res => {
    const t = text.replace(/[『』「」【】▶︎―…]/g, ' ');
    try{
      if (window.Android){ window.__said = res; Android.speak(t); return; }
      if (window.speechSynthesis){ const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 1.1; u.onend = res; u.onerror = res; speechSynthesis.speak(u); return; }
    }catch(e){}
    res();
  });
}
window.onNativeSaid = () => { const r = window.__said; window.__said = null; r && r(); };

async function line(text, cls = '', wait = 700){
  const p = document.createElement('p'); p.className = cls; log.appendChild(p);
  if (fast){ p.textContent = text; log.scrollTop = log.scrollHeight; await sleep(40); return; }
  for (let i = 1; i <= text.length; i++){ p.textContent = text.slice(0, i); if (i % 2 === 0) await sleep(18); log.scrollTop = log.scrollHeight; }
  if (speak && cls !== 'dim') await Promise.race([say(text), sleep(10000)]); else await sleep(wait);
}
function html(h, cls){ const d = document.createElement('div'); d.className = cls; d.innerHTML = h; log.appendChild(d); log.scrollTop = log.scrollHeight; }
function tapToContinue(){
  if (fast) return sleep(250);
  $('next').style.display = 'block';
  return new Promise(res => {
    const h = () => { $('battle').removeEventListener('click', h); $('next').style.display = 'none'; res(); };
    setTimeout(() => $('battle').addEventListener('click', h), 200);
  });
}
function status(a, b){
  const row = (f, c) => `<div class="hp"><b style="color:var(--${c})">${f.n}</b><div class="bar ${f.hp < 30 ? 'low' : ''}"><i style="width:${Math.max(0, f.hp)}%"></i></div><span>${Math.max(0, Math.round(f.hp))}</span></div>`;
  $('status').innerHTML = a ? row(a, 'a') + row(b, 'b') : '';
}
const fill = (s, A, B) => s.replace(/\{A\}/g, A.n).replace(/\{B\}/g, B.n);

// ================= 戦闘 =================
// 属性（炎>風>土>雷>水>炎）と、職業・スキルのタグ相性
function advantage(a, b){
  let m = 1;
  if (EL_BEATS[a.el] === b.el) m *= 1.35;
  if (EL_BEATS[b.el] === a.el) m /= 1.35;
  let t = 1;
  const at = [...a.job.tags, ...a.skill.tags], bt = [...b.job.tags, ...b.skill.tags];
  at.forEach(x => bt.forEach(y => { if ((TAG_BEATS[x] || []).includes(y)) t *= 1.12; if ((TAG_BEATS[y] || []).includes(x)) t /= 1.12; }));
  return m * Math.max(.7, Math.min(1.45, t));
}
function findEvent(a, b){
  for (const ev of shuffle(EVENTS)){
    if (!ev.t.length) continue;
    const hitAB = a.keys.has(ev.a) && b.keys.has(ev.b), hitBA = b.keys.has(ev.a) && a.keys.has(ev.b);
    if (!hitAB && !hitBA) continue;
    if (ev.p != null && R() > ev.p) continue;
    return hitAB ? {ev, A: a, B: b} : {ev, A: b, B: a};
  }
  return null;
}
function attackLine(atk, def){
  const r = R();
  if (atk.skill.p >= 6 && r < .32) return {t: fill(pick(atk.skill.lines), atk, def)};
  if (atk.skill.p < 6 && r < .15) return {t: fill(pick(atk.skill.lines), atk, def), weak: true};
  return {t: fill(pick(atk.job.lines), atk, def)};
}
async function reveal(f){
  if (f.revealed) return;
  f.revealed = true;
  html(`【かんてい】${f.n}ののうりょくランク　${RANK_TXT[rankOf(f.power)]}`, 'rank');
  await sleep(fast ? 40 : 1000);
}

// ---- 実況・ハプニング・締めのひとこと ----
const HAPPEN = [
  'かんきゃくせきからとんできたボールが、{L}のこうとうぶに当たった。',
  '{L}のくつひもがほどけて、ごうかいにころんだ。',
  '{L}のスマホが鳴った。……じっかからだ。',
  'しんぱんが大きなくしゃみをした。おどろいた{L}は、思わず場外へ一歩出た。',
  '会場にまよいこんだねこが、{L}の足元でねころがった。{L}はうごけない。',
  '{L}はおはらが鳴った。朝ごはんを食べわすれていたらしい。',
  '強い風がふき、{L}のカツラが……いや、なんでもない。',
];
const OUTRO_W = [
  '{W}はかんきゃくせきにむかって、しんしんとおじぎをした。',
  '{W}「……まあ、こんなもんでしょ」――ちょっとドヤ顔だ。',
  '{W}はガッツポーズをしようとして、こしをいためた。',
  '{W}はしょうりのダンスをおどった。だれもたのんでいない。',
  '{W}「おうえんしてくれたお母さん、ありがとう！」',
];
const OUTRO_L = [
  '{L}「今日は……ちょうしがわるかっただけだ……」',
  '{L}はたんかではこばれながら、かんきゃくに手をふっている。',
  '{L}「つぎは……ぜったいに……」――そのままねむってしまった。',
  '{L}はなきながら、帰りにラーメンを食べることにした。',
  'かんきゃくせきの{L}のかぞくが、そっとはくしゅをおくっている。',
  '{L}「……のうりょく、えらび直したい」',
];
const fill2 = (s, W, L) => s.replace(/\{W\}/g, W.n).replace(/\{L\}/g, L.n);
async function hit(atk, def, dmg, text, C, a, b){
  dmg = Math.max(0, Math.round(Math.min(dmg, def.hp)));
  def.hp -= dmg; status(a, b);
  const who = text.includes(atk.n) ? '' : `${atk.n}：`;
  await line(`▶ ${who}${text}（${def.n}に ${dmg} ダメージ）`, C(atk), 900);
}

async function fight(a, b){
  a.hp = 100; b.hp = 100; status(a, b);
  const C = f => f === a ? 'a' : 'b';
  // ===== 起：入場 =====
  html('<span class="tag">き</span>入場', 'dim');
  await line(`じっきょう「青コーナー、${a.n}！　${a.label}、きりふだは『${a.skill.n}』！」`, 'say');
  await reveal(a);
  await line(`じっきょう「赤コーナー、${b.n}！　${b.label}、きりふだは『${b.skill.n}』！」`, 'say');
  await reveal(b);

  // 勝敗とパターンを決める
  const found = findEvent(a, b);
  const decisive = found && found.ev.win;
  let W;
  if (decisive) W = found.ev.win === 'a' ? found.A : found.B;
  else {
    const pa = Math.pow(a.power, 2.2) * advantage(a, b), pb = Math.pow(b.power, 2.2);
    W = R() < pa / (pa + pb) ? a : b;
  }
  const L = W === a ? b : a;
  const gap = Math.abs(a.power - b.power);
  // 逆転（負けそうだった側が勝つ）/ 圧勝 / ハプニング
  const pattern = decisive ? 'event' : R() < .15 ? 'happen' : (gap < 30 && R() < .55) ? 'comeback' : 'crush';

  // ===== 承：ぶつかり合い =====
  html('<span class="tag">しょう</span>ぶつかり合い', 'dim');
  const first = R() < .5 ? a : b, second = first === a ? b : a;
  const lead = pattern === 'comeback' ? L : W;        // しょうでおしているがわ
  const big = 26 + R() * 14, small = 8 + R() * 10;
  await hit(first, second, first === lead ? big : small, fill(pick(first.job.lines), first, second), C, a, b);
  await hit(second, first, second === lead ? big : small, fill(pick(second.job.lines), second, first), C, a, b);
  // 解説
  if (EL_BEATS[a.el] === b.el || EL_BEATS[b.el] === a.el){
    const s1 = EL_BEATS[a.el] === b.el ? a : b, s2 = s1 === a ? b : a;
    await line(`かいせつ「${EL[s1.el].n}は${EL[s2.el].n}に強い。ぞくせいでは${s1.n}がゆうりですね」`, 'say');
  } else if (gap >= 35){
    const hi = a.power > b.power ? a : b;
    await line(`かいせつ「これは……地力がちがいすぎます。${hi.n}、よゆうのひょうじょうです」`, 'say');
  } else {
    await line(`かいせつ「${lead.n}がややおしていますね。でも、まだきりふだがのこっています」`, 'say');
  }

  // ===== 転：切り札・ハプニング =====
  html('<span class="tag">てん</span>まさかのてんかい', 'dim');
  if (found && !decisive){
    for (const t of found.ev.t) await line(fill(t, found.A, found.B), 'ev', 900);
  }
  if (pattern === 'event'){
    await line('――そのとき、思いもよらないことがおきた。', 'sys');
    for (const t of found.ev.t) await line(fill(t, found.A, found.B), 'ev', 900);
  } else if (pattern === 'comeback'){
    await line(`じっきょう「${L.n}、このままおし切るか！？」`, 'say');
    await line(`${W.n}「……まだだ。きりふだ『${W.skill.n}』！」`, C(W), 800);
    await hit(W, L, 45 + R() * 15, fill(pick(W.skill.lines), W, L), C, a, b);
    await line('じっきょう「な、なんとー！けいせいぎゃくてんだーっ！」', 'say');
  } else if (pattern === 'crush'){
    await line(`${L.n}「こうなったら……きりふだ『${L.skill.n}』！」`, C(L), 800);
    await line(fill(pick(L.skill.lines), L, W), C(L), 900);
    if (L.skill.p < 15) await line(`……${W.n}は、きょとんとしている。何もおきていない。`, 'dim', 900);
    else await line(`しかし${W.n}は、それをましょうめんからうけ止めた！`, C(W), 900);
    await line(`じっきょう「きいてない！${W.n}、びくともしません！」`, 'say');
  } else {
    await line(`じっきょう「おっと、これは……！？」`, 'say');
    await line(fill2(pick(HAPPEN), W, L), 'ev', 1000);
    await line(`じっきょう「${W.n}、このげきをみのがさない！」`, 'say');
  }

  // ===== 結：決着 =====
  html('<span class="tag">けつ</span>けっちゃく', 'dim');
  if (pattern !== 'event') await hit(W, L, L.hp, fill(pick(W.job.lines), W, L), C, a, b);
  if (L.hp > 0){ L.hp = 0; status(a, b); }
  await line(`${L.n}は たおれた。`, C(L));
  await line(`🏆 ${W.n}のしょうり！`, 'big');
  await line(R() < .5 ? fill2(pick(OUTRO_W), W, L) : fill2(pick(OUTRO_L), W, L), 'dim', 1000);
  return W;
}

// ================= トーナメント =================
async function runTournament(){
  let entrants = players.map(p => p.f);
  const names = shuffle(CPU_NAMES);
  while (entrants.length < 8){
    const job = pick(JOB.filter(j => !used.job.has(j.id))), skill = pick(SKILL.filter(s => !used.skill.has(s.id)));
    used.job.add(job.id); used.skill.add(skill.id);
    entrants.push(makeFighter('CPU ' + names.pop(), false, job, pick(ELEMENTS).id, skill));
  }
  entrants = shuffle(entrants);
  fast = false; $('skip').style.color = '';
  log.innerHTML = ''; status(); show('battle');
  $('round').textContent = '組み合わせ';
  await line('―――― いのうトーナメント かいまく ――――', 'sys');
  html(entrants.map((f, i) => (i % 2 === 0 ? '・' : '　vs　') + `${f.n}<span style="opacity:.7">（${f.label}）</span>` + (i % 2 ? '<br>' : '')).join(''), 'br');
  await tapToContinue();

  const rounds = ['いっかいせん', 'じゅんけっしょう', 'けっしょう'];
  let alive = entrants;
  for (let r = 0; r < 3; r++){
    const next = [];
    for (let m = 0; m < alive.length; m += 2){
      const label = alive.length > 2 ? `${rounds[r]}　だい${m / 2 + 1}しあい` : rounds[r];
      $('round').textContent = label;
      log.innerHTML = ''; status();
      await line(`【${label}】`, 'sys');
      next.push(await fight(alive[m], alive[m + 1]));
      await tapToContinue();
    }
    alive = next;
  }
  stopSpeak();
  const champ = alive[0];
  $('endTitle').textContent = `🏆 ゆうしょう：${champ.n} 🏆`;
  $('endBuild').innerHTML = `${champ.label}<br>× ${champ.skill.n}<small>のうりょくランク ${rankOf(champ.power)}</small>`;
  $('endList').innerHTML = [...entrants].sort((x, y) => y.power - x.power)
    .map(f => `<div><b>${rankOf(f.power)}</b><span>${f.n}：${f.label} × ${f.skill.n}</span></div>`).join('');
  show('end');
}
$('again').onclick = () => $('start').click();
$('toSetup').onclick = () => { renderSetup(); show('setup'); };

function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
</script>
