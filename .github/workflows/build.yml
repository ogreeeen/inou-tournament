name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk inou-tournament.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inou-tournament.apk
          path: inou-tournament.apk

      # スマホのブラウザから直接ダウンロードできるよう「Releases」にも置く
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 異能トーナメント 最新版
          files: inou-tournament.apk
          make_latest: true
